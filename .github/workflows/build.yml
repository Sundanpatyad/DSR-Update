name: Build Binaries

on:
  push:
    branches: [ create_tool ]

jobs:

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install -g pkg

      - name: Build
        run: |
          mkdir dist
          pkg git-commit.js --targets node18-win-x64 --out-path dist

      - name: Debug
        run: dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*


  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install -g pkg

      - name: Build
        run: |
          mkdir dist
          pkg git-commit.js --targets node18-linux-x64 --out-path dist

      - name: Debug
        run: ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*


  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install -g pkg

      - name: Build
        run: |
          mkdir dist
          pkg git-commit.js --targets node18-macos-x64,node18-macos-arm64 --out-path dist

      - name: Debug
        run: ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
